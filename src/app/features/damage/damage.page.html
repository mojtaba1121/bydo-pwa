<main class="app-shell page-bg">
  <header class="detail-top">
    <a [routerLink]="['/reservation',bikeId]" class="icon-btn"><lucide-icon name="arrow-right" /></a><strong>{{ 'damageTitle' | t }}</strong><span></span>
  </header>
  <section class="damage-wrap">
    <p class="eyebrow">{{ 'preRideCheck' | t }}</p>
    <h1>{{ 'damageHeading' | t }}</h1>
    <p class="muted">{{ 'damageHelp' | t }}</p>
    <div class="bike-inspector">
      <bydo-bike-visual [size]="150" />
      <button class="hotspot wheel" [class.active]="selected()==='wheelTire'" (click)="selected.set('wheelTire')">{{ '1' | faNumber }}</button>
      <button class="hotspot seat" [class.active]="selected()==='seat'" (click)="selected.set('seat')">{{ '2' | faNumber }}</button>
      <button class="hotspot handle" [class.active]="selected()==='handleBrake'" (click)="selected.set('handleBrake')">{{ '3' | faNumber }}</button>
    </div>
    <div class="damage-grid">
      <button (click)="selected.set('wheelTire')" [class.active]="selected()==='wheelTire'">
        <lucide-icon name="circle-dot" /><span>{{ 'wheelTire' | t }}</span>
      </button>
      <button (click)="selected.set('handleBrake')" [class.active]="selected()==='handleBrake'">
        <lucide-icon name="octagon-alert" /><span>{{ 'handleBrake' | t }}</span>
      </button>
      <button (click)="selected.set('bikeLock')" [class.active]="selected()==='bikeLock'">
        <lucide-icon name="lock" /><span>{{ 'bikeLock' | t }}</span>
      </button>
      <button (click)="selected.set('light')" [class.active]="selected()==='light'">
        <lucide-icon name="lightbulb" /><span>{{ 'light' | t }}</span>
      </button>
    </div>
    <label for="damageDescription">{{ 'moreDetailsOptional' | t }}</label>
    <textarea id="damageDescription" rows="3" [placeholder]="'damagePlaceholder' | t"></textarea>
    <button class="btn primary wide" [disabled]="!selected()" (click)="submit()">
      <lucide-icon name="check-circle-2" /> {{ 'submitDamage' | t }}
    </button>
  </section>
</main>
